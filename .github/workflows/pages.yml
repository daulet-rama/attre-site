name: pages

on:
  push:
    branches: [main]
    paths-ignore: ['admin/**', '.admin/**']   # код админки и её пароли сайт не пересобирают (сохранения товаров — пересобирают)
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Pillow для нарезки фото
        run: pip install pillow==12.1.1
      - name: Кэш нарезанных фото (сборка после правки в админке — без перерезки всех фото)
        uses: actions/cache@v4
        with:
          path: .cache/img
          key: img-v1-${{ hashFiles('media/**') }}
          restore-keys: img-v1-
      - name: Сборка
        env:
          ATTRE_ORIGIN: https://${{ github.repository_owner }}.github.io
          ATTRE_BASE: /${{ github.event.repository.name }}/
        run: python build.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
