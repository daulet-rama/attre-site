name: pages

on:
  push:
    branches: [main]
    # код админки, её пароли и заготовка для Cloudflare сайт не пересобирают (сохранения товаров — пересобирают)
    paths-ignore: ['admin/**', '.admin/**', 'cloud/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Pillow для нарезки фото
        run: pip install pillow==12.1.1
      - name: Кэш нарезанных фото (сборка после правки в админке — без перерезки всех фото)
        uses: actions/cache@v4
        with:
          path: .cache/img
          key: img-v1-${{ hashFiles('media/**') }}
          restore-keys: img-v1-
      - name: Сборка
        env:
          ATTRE_ORIGIN: https://attre.pages.dev
          ATTRE_BASE: /
        run: python build.py
      # Сайт живёт на Cloudflare Pages (проект attre); папку functions/ (видео кусками) wrangler берёт из корня репозитория.
      # Секреты CLOUDFLARE_API_TOKEN (право Account · Cloudflare Pages · Edit, до 29.10.2027) и CLOUDFLARE_ACCOUNT_ID — в настройках репозитория.
      - name: Выкладка на Cloudflare Pages (attre.pages.dev)
        uses: cloudflare/wrangler-action@v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.151.3'
          command: pages deploy site --project-name=attre --branch=main --commit-hash=${{ github.sha }}
      # Старый адрес на GitHub Pages: только переадресации на тот же путь attre.pages.dev (ссылки, разосланные раньше)
      - name: Переадресации со старого адреса
        run: python tools/redirect_site.py site redirect https://attre.pages.dev/ /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: redirect

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
